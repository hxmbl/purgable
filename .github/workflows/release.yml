name: release

on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos_goarch: linux_amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            goos_goarch: linux_arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            goos_goarch: darwin_amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            goos_goarch: darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --release --locked

      - name: Stage binary
        run: |
          mkdir -p stage
          cp target/${{ matrix.target }}/release/purgable stage/purgable

      - uses: actions/upload-artifact@v5
        with:
          name: purgable-${{ matrix.goos_goarch }}
          path: stage/purgable

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Package archives and checksums
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          mkdir -p dist
          for dir in artifacts/purgable-*; do
            goos_goarch="${dir#artifacts/purgable-}"
            mkdir -p "dist/$goos_goarch"
            cp "$dir/purgable" "dist/$goos_goarch/purgable"
            cp LICENSE "dist/$goos_goarch/LICENSE"
          done

          cd dist
          tar -czf "purgable_${VERSION}_Linux_x86_64.tar.gz"    -C linux_amd64   purgable LICENSE
          tar -czf "purgable_${VERSION}_Linux_arm64.tar.gz"     -C linux_arm64   purgable LICENSE
          tar -czf "purgable_${VERSION}_Darwin_x86_64.tar.gz"   -C darwin_amd64  purgable LICENSE
          tar -czf "purgable_${VERSION}_Darwin_arm64.tar.gz"    -C darwin_arm64  purgable LICENSE
          sha256sum purgable_${VERSION}_*.tar.gz | sort -k 2 > checksums.txt
          cat checksums.txt

      - name: Generate Homebrew formula
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          sha() { sha256sum "dist/$1" | cut -d' ' -f1; }
          S_DX="$(sha purgable_${VERSION}_Darwin_x86_64.tar.gz)"
          S_DA="$(sha purgable_${VERSION}_Darwin_arm64.tar.gz)"
          S_LX="$(sha purgable_${VERSION}_Linux_x86_64.tar.gz)"
          S_LA="$(sha purgable_${VERSION}_Linux_arm64.tar.gz)"

          cat > purgable.rb <<'RUBY'
          # typed: false
          # frozen_string_literal: true

          # This file was generated by the release workflow. DO NOT EDIT.
          class Purgable < Formula
            desc "Recursively find files named exactly PURGABLE and ask before deleting them."
            homepage "https://github.com/Hxmbl/purgable"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/hxmbl/purgable/releases/download/${TAG}/purgable_${VERSION}_Darwin_x86_64.tar.gz"
                sha256 "${S_DX}"

                define_method(:install) do
                  bin.install "purgable"
                end
              end
              if Hardware::CPU.arm?
                url "https://github.com/hxmbl/purgable/releases/download/${TAG}/purgable_${VERSION}_Darwin_arm64.tar.gz"
                sha256 "${S_DA}"

                define_method(:install) do
                  bin.install "purgable"
                end
              end
            end

            on_linux do
              if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
                url "https://github.com/hxmbl/purgable/releases/download/${TAG}/purgable_${VERSION}_Linux_x86_64.tar.gz"
                sha256 "${S_LX}"

                define_method(:install) do
                  bin.install "purgable"
                end
              end
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "https://github.com/hxmbl/purgable/releases/download/${TAG}/purgable_${VERSION}_Linux_arm64.tar.gz"
                sha256 "${S_LA}"

                define_method(:install) do
                  bin.install "purgable"
                end
              end
            end

            test do
              system "#{bin}/purgable --help"
            end
          end
          RUBY
          sed -i.bak "s|\${VERSION}|${VERSION}|g; s|\${TAG}|${TAG}|g" purgable.rb
          sed -i.bak "s|\${S_DX}|${S_DX}|g; s|\${S_DA}|${S_DA}|g; s|\${S_LX}|${S_LX}|g; s|\${S_LA}|${S_LA}|g" purgable.rb
          rm -f purgable.rb.bak
          ruby -c purgable.rb

      - name: Create GitHub Release
        run: |
          cd dist
          gh release create "${GITHUB_REF_NAME}" purgable_*.tar.gz checksums.txt \
            --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Homebrew formula to tap
        run: |
          TAG="${GITHUB_REF_NAME}"
          git clone git@github.com:Hxmbl/homebrew-tap.git /tmp/homebrew-tap
          cp purgable.rb /tmp/homebrew-tap/purgable.rb
          cd /tmp/homebrew-tap
          git config user.name "hxmbl"
          git config user.email "hxmbl@users.noreply.github.com"
          git add purgable.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, skipping commit"
          else
            git commit -m "purgable ${TAG}"
            git push origin HEAD
          fi