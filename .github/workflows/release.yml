name: release

on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Homebrew formula to tap
        run: |
          TAG="${GITHUB_REF_NAME}"
          git clone git@github.com:Hxmbl/homebrew-tap.git /tmp/homebrew-tap
          cp dist/homebrew/purgable.rb /tmp/homebrew-tap/purgable.rb
          cd /tmp/homebrew-tap
          git config user.name "hxmbl"
          git config user.email "hxmbl@users.noreply.github.com"
          git add purgable.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, skipping commit"
          else
            git commit -m "purgable ${TAG}"
            git push origin HEAD
          fi
