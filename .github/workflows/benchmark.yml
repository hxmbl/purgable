name: Benchmark

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Comma-separated PURGABLE_JOBS values"
        required: false
        default: "1,2,4"
      reps:
        description: "Repetitions for read-only measurements (minimum 5)"
        required: false
        default: "5"
      scale:
        description: "Fixture scale factor (1 = historical shape)"
        required: false
        default: "1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary and runner
        run: |
          cargo build --release --locked
          cargo build --release --locked --example bench

      - name: Run benchmarks
        run: |
          target/release/examples/bench run \
            --jobs "${{ inputs.jobs }}" \
            --reps "${{ inputs.reps }}" \
            --scale "${{ inputs.scale }}" \
            --work "$RUNNER_TEMP/bench-fixtures" \
            --out bench-results

      - name: Post summary
        if: always()
        run: cat bench-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: benchmark-results
          path: bench-results/
